{% extends "layout.html" %}
{% block title %}Log In{% endblock %}
{% block main %}
    <div class="auth-card card-panel mx-auto p-4">
        <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>
        <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input autocomplete="username" autofocus class="form-control" id="username" name="username" type="text" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input autocomplete="current-password" class="form-control" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-accent w-100" type="submit">Entrar</button>
        </form>
        <p class="text-center text-secondary mt-3 mb-0">¿No tienes cuenta? <a href="/register">Regístrate</a></p>
    </div>
{% endblock %}
