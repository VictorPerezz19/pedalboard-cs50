{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block main %}
    <div class="auth-card card-panel mx-auto p-4">
        <h1 class="h3 mb-4 text-center">Crear cuenta</h1>
        <form action="/register" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input autocomplete="username" autofocus class="form-control" id="username" name="username" type="text" maxlength="30" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña (mín. 6 caracteres)</label>
                <input autocomplete="new-password" class="form-control" id="password" name="password" type="password" minlength="6" required>
            </div>
            <div class="mb-3">
                <label for="confirmation" class="form-label">Repite la contraseña</label>
                <input autocomplete="new-password" class="form-control" id="confirmation" name="confirmation" type="password" required>
            </div>
            <button class="btn btn-accent w-100" type="submit">Registrarme</button>
        </form>
        <p class="text-center text-secondary mt-3 mb-0">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </div>
{% endblock %}
